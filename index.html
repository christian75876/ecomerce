<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merku — Gestión de tienda, inventario y ventas</title>
    <meta name="description" content="Plataforma integral para gestionar tu tienda online: catálogo, inventario, pedidos, POS, caja y analítica en un solo panel." />
    <meta name="theme-color" content="#f97316" />

    <!-- PWA (manifest injected by VitePWA at build time as manifest.webmanifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Merku" />
    <meta name="application-name" content="Merku" />
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Merku" />
    <meta property="og:locale"      content="es_CO" />
    <meta property="og:url"         content="%VITE_APP_URL%/" />
    <meta property="og:title"       content="Merku — Marketplace y gestión de tienda" />
    <meta property="og:description" content="Encuentra productos de tiendas locales o gestiona tu propio negocio: catálogo, inventario, pedidos, POS y más desde un solo panel." />
    <meta property="og:image"       content="%VITE_APP_URL%/icons/icon-512x512.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"   content="Logo de Merku" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Merku — Marketplace y gestión de tienda" />
    <meta name="twitter:description" content="Encuentra productos de tiendas locales o gestiona tu propio negocio desde un solo panel." />
    <meta name="twitter:image"       content="%VITE_APP_URL%/icons/icon-512x512.png" />
    <meta name="twitter:image:alt"   content="Logo de Merku" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter as system fallback (improves CLS) -->
    <style>
      :root { font-display: swap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
