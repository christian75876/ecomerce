<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Título y meta description por defecto: solo se usan como fallback antes de
         que React monte y react-helmet-async inyecte los reales de cada ruta. NO
         agregar aquí <link rel="canonical">, og:url, og:title, og:description ni
         twitter:title/description — cada página pública ya los define vía <Helmet>,
         y react-helmet-async NO reemplaza tags estáticos del HTML, solo añade los
         suyos: tenerlos aquí también produce tags duplicados y contradictorios
         (p. ej. dos <link rel="canonical"> con URLs distintas), lo que confundió a
         Google y causó los "Soft 404" / "Descubierta: actualmente sin indexar". -->
    <title>Merku — Gestión de tienda, inventario y ventas</title>
    <meta name="keywords" content="marketplace Colombia, tiendas online, vender en línea, gestión de inventario, punto de venta, POS, catálogo digital, Merku" />
    <meta name="author" content="Merku" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FF6B35" />

    <!-- PWA (manifest injected by VitePWA at build time as manifest.webmanifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Merku" />
    <meta name="application-name" content="Merku" />
    <meta name="msapplication-TileColor" content="#FF6B35" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Open Graph (solo campos que ninguna página sobreescribe vía Helmet) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Merku" />
    <meta property="og:locale"      content="es_CO" />
    <meta property="og:image"       content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Merku — Tu mercado local, en un solo lugar" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:image"       content="%VITE_APP_URL%/og-image.png" />
    <meta name="twitter:image:alt"   content="Merku — Tu mercado local, en un solo lugar" />

    <!-- Structured data — Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Merku",
      "url": "%VITE_APP_URL%",
      "logo": "%VITE_APP_URL%/icons/icon-512x512.png",
      "description": "Marketplace y plataforma de gestión de tiendas locales en Colombia.",
      "sameAs": []
    }
    </script>

    <!-- Fonts: Bricolage Grotesque (display), Work Sans (body), IBM Plex Mono (data/prices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
